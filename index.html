<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>어린왕자: 별가루 모으기</title>
  <style>
    body { background-color: #0b1d3a; color: #f9d976; font-family: 'serif'; text-align: center; padding-top: 20vh; margin: 0; }
    .box { margin: 20px auto; padding: 30px; border: 1px solid #f9d976; border-radius: 10px; width: 70%; background: rgba(255,255,255,0.05); }
    input, button { padding: 12px; margin: 10px; border-radius: 5px; border: none; font-size: 16px; }
    input { width: 60%; background-color: #1a2a47; color: #fff; border: 1px solid #f9d976; }
    button { background-color: #f9d976; color: #0b1d3a; font-weight: bold; cursor: pointer; }
    #status-message { font-size: 1.2em; line-height: 1.5; }
  </style>
</head>
<body>
  <div id="login-section">
    <h2>당신의 별 이름은 무엇인가요?</h2>
    <input type="text" id="starName" placeholder="예: B612">
    <button onclick="saveName()">지구로 내려가기</button>
  </div>

  <div id="result-section" class="box" style="display:none;">
    <p id="status-message">별가루를 상자에 담는 중...</p>
  </div>

  <script>
    // URL에서 태그 위치 파라미터 가져오기 (예: ?loc=slide)
    const urlParams = new URLSearchParams(window.location.search);
    const locationTag = urlParams.get('loc');
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbx8he8hwo8fdvTcnVo2CLHC7aLtuLNWRR0BAnV5PcVEikgPuCZ9dr1hZyZwy9Wh8PunxQ/exec';

    function checkUser() {
      const savedName = localStorage.getItem('starName');
      if (savedName) {
        document.getElementById('login-section').style.display = 'none';
        
        if (locationTag) {
          document.getElementById('result-section').style.display = 'block';
          collectStardust(savedName, locationTag);
        } else {
          // NFC 태그 없이 그냥 접속했을 때의 기본 화면
          document.getElementById('login-section').style.display = 'block';
          document.getElementById('login-section').innerHTML = `<h2>${savedName} 별의 여행자님, 환영합니다.</h2><p>놀이터에서 별가루를 찾아보세요.</p>`;
        }
      }
    }

    function saveName() {
      const name = document.getElementById('starName').value.trim();
      if (name) {
        localStorage.setItem('starName', name);
        checkUser();
      }
    }

    function collectStardust(name, loc) {
      fetch(`${scriptUrl}?name=${name}&location=${loc}`)
        .then(response => response.json())
        .then(data => {
          document.getElementById('status-message').innerText = `✨ ${name} 별의 상자에\n새로운 별가루가 담겼습니다! ✨\n\n(위치: ${loc})`;
        })
        .catch(error => {
          document.getElementById('status-message').innerText = `별가루가 바람에 날아갔습니다. 다시 시도해주세요.`;
        });
    }

    window.onload = checkUser;
  </script>
</body>
</html>
