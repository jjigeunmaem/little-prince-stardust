<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지리학자의 메모</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fdf6e3;
      background-image: url('https://www.transparenttextures.com/patterns/notebook.png');
      color: #2c3e50;
      font-family: 'Nanum Pen Script', cursive; /* 전체 폰트 적용 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .memo-container {
      background: rgba(255, 255, 255, 0.6);
      border-left: 4px solid #d35400;
      padding: 30px 20px;
      max-width: 400px;
      box-shadow: 3px 5px 15px rgba(0,0,0,0.1);
      transform: rotate(-2deg);
    }
    .coordinates {
      /* font-family 설정 제거하여 전체 손글씨 폰트 상속 */
      font-size: 1.3em; /* 폰트 특성에 맞춰 크기 확대 (기존 1.1em -> 1.6em) */
      color: #7f8c8d;
      text-align: right;
      margin-bottom: 25px;
      line-height: 1.4;
    }
    p {
      font-size: 2.2em;
      line-height: 1.6;
      word-break: keep-all;
      text-align: center;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="memo-container">
    <div class="coordinates">관측 위치: 북위 37도 모래의 바다<br>특이사항: 알 수 없는 흔적 다수 발견</div>
    <p>가장 깊은 발자국이 남는 곳,<br><br>그곳에 복을 주는 존재의 집을 지으면<br>당신에게도 복이 있으리라.</p>
  </div>
</body>
</html>
