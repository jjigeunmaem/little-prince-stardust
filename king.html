<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>왕의 칙령</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #f4e8d3; /* 낡은 양피지 배경색 */
      background-image: url('https://www.transparenttextures.com/patterns/old-wall.png'); /* 거친 질감 추가 */
      color: #3b2f2f; /* 짙은 갈색 잉크 톤 */
      font-family: 'Nanum Myeongjo', serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 100vh;
    }
    .decree-box {
      border: 4px double #8b0000; /* 진홍색 칙령 테두리 */
      padding: 40px 20px;
      margin: 10px;
      background: rgba(255, 255, 255, 0.2);
    }
    h1 {
      color: #8b0000;
      font-size: 2.2em;
      margin-bottom: 30px;
    }
    p {
      font-size: 1.3em;
      line-height: 1.8;
      word-break: keep-all;
      margin-bottom: 15px;
    }
    .seal {
      margin-top: 30px;
      font-size: 3.5em; /* 왁스 실링 도장 이모지 */
    }
  </style>
</head>
<body>
  <div class="decree-box">
    <h1>짐이 명하노라!</h1>
    <p>발이 땅에서 가장 멀어지는 곳에서는<br>무엇이 보일까?</p>
    <p>당장 그곳으로 올라가<br>너희의 세상을 내려다보도록 명한다!</p>
    <div class="seal">💮</div>
  </div>
</body>
</html>
